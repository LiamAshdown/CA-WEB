name: Laravel

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-18.04
    steps:
      - name: Deploying to Contractors App API
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{secrets.CONTRACTORS_APP_API_IP}} # IP address of the server you wish to ssh into
          username: ${{ secrets.CONTRACTORS_APP_USERNAME }} # User of the server you want to ssh into
          key: ${{secrets.CONTRACTORS_APP_SSH_KEY}}
          script:  |
            echo "Deploying to Contractors App API"
            cd /var/www
            git pull origin master
            composer install --no-dev --prefer-dist --optimize-autoloader
            echo "Deployed to Contractors App API"
